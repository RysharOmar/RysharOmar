<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290">
  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <filter id="gl">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rg">
      <feGaussianBlur stdDeviation="25" result="b"/>
      <feFlood flood-color="#dc2626" flood-opacity="0.06"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="sl" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="rgba(0,0,0,0.07)" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="780" height="290" rx="12" fill="#0a0a0a" stroke="#262626" stroke-width="1" filter="url(#rg)"/>
  <rect width="780" height="290" rx="12" fill="url(#sl)"/>

  <rect width="780" height="38" rx="12" fill="url(#tg)"/>
  <rect y="26" width="780" height="12" fill="#171717"/>
  <circle cx="22" cy="19" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="42" cy="19" r="6" fill="#f59e0b" opacity="0.85"/>
  <circle cx="62" cy="19" r="6" fill="#22c55e" opacity="0.85"/>
  <text x="390" y="23" text-anchor="middle" fill="#525252" font-family="monospace" font-size="11.5" letter-spacing="0.5">ryshar@kali — ~/operaciones/criticas</text>

  <text x="24" y="68" font-family="monospace" font-size="13" opacity="0">
    <tspan fill="#22c55e">ryshar</tspan><tspan fill="#525252">@ops</tspan><tspan fill="#a3a3a3">:</tspan><tspan fill="#3b82f6">~/critical-infra</tspan><tspan fill="#a3a3a3">$ </tspan><tspan fill="#e5e5e5">./deploy.sh --mode=hardened</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.2s" fill="freeze"/>
  </text>

  <text x="24" y="94" font-family="monospace" font-size="13" opacity="0" filter="url(#gl)">
    <tspan fill="#dc2626">[►]</tspan><tspan fill="#a3a3a3"> Escaneando superficie de ataque...</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.1s" fill="freeze"/>
  </text>

  <text x="24" y="118" font-family="monospace" font-size="13" opacity="0" filter="url(#gl)">
    <tspan fill="#dc2626">[►]</tspan><tspan fill="#a3a3a3"> </tspan><tspan fill="#e5e5e5">47</tspan><tspan fill="#a3a3a3"> vectores mapeados </tspan><tspan fill="#525252">|</tspan><tspan fill="#a3a3a3"> </tspan><tspan fill="#22c55e">0 críticos</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.1s" fill="freeze"/>
  </text>

  <text x="24" y="142" font-family="monospace" font-size="13" opacity="0" filter="url(#gl)">
    <tspan fill="#dc2626">[►]</tspan><tspan fill="#a3a3a3"> Configurando mesh </tspan><tspan fill="#eab308">zero-trust</tspan><tspan fill="#a3a3a3">...</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.1s" fill="freeze"/>
  </text>

  <text x="24" y="166" font-family="monospace" font-size="13" opacity="0" filter="url(#gl)">
    <tspan fill="#dc2626">[►]</tspan><tspan fill="#a3a3a3"> Failover automatizado: </tspan><tspan fill="#22c55e">ACTIVO</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="4.1s" fill="freeze"/>
  </text>

  <text x="24" y="196" font-family="monospace" font-size="13" opacity="0" filter="url(#gl)">
    <tspan fill="#22c55e">[✓]</tspan><tspan fill="#22c55e"> Infraestructura desplegada. </tspan><tspan fill="#e5e5e5">0 vulnerabilidades.</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="5.1s" fill="freeze"/>
  </text>

  <text x="24" y="220" font-family="monospace" font-size="13" opacity="0" filter="url(#gl)">
    <tspan fill="#22c55e">[✓]</tspan><tspan fill="#22c55e"> Respuesta: </tspan><tspan fill="#eab308">&lt;200ms</tspan><tspan fill="#525252"> | </tspan><tspan fill="#22c55e">Uptime: </tspan><tspan fill="#eab308">99.99%</tspan>
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="6.0s" fill="freeze"/>
  </text>

  <text x="24" y="254" font-family="monospace" font-size="13" opacity="0">
    <tspan fill="#22c55e">ryshar</tspan><tspan fill="#525252">@ops</tspan><tspan fill="#a3a3a3">:</tspan><tspan fill="#3b82f6">~/critical-infra</tspan><tspan fill="#a3a3a3">$ </tspan>
    <animate attributeName="opacity" from="0" to="0.5" dur="0.3s" begin="6.8s" fill="freeze"/>
  </text>

  <rect x="24" y="242" width="9" height="16" rx="1" fill="#dc2626" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite" begin="6.8s"/>
  </rect>
</svg>
