<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Core Tech Stack">
  <defs>
    <radialGradient id="tsGlow" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="tsGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="tsLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="880" height="520" fill="#0a0a0a"/>
  <rect width="880" height="520" fill="url(#tsGlow)"/>
  <rect width="880" height="520" fill="url(#tsGrid)"/>

  <g stroke="#3f3f46" stroke-width="1.5" fill="none" stroke-linecap="square">
    <path d="M14 30 L14 14 L30 14"/>
    <path d="M850 14 L866 14 L866 30"/>
    <path d="M14 490 L14 506 L30 506"/>
    <path d="M850 506 L866 506 L866 490"/>
  </g>

  <!-- header -->
  <rect x="40" y="30" width="30" height="30" rx="6" fill="#0d0d0d" stroke="#dc2626" stroke-opacity="0.6" stroke-width="1"/>
  <text x="55" y="50" fill="#ef4444" font-size="13" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">01</text>
  <rect x="80" y="32" width="3" height="26" fill="#dc2626"/>
  <text x="92" y="51" fill="#ffffff" font-size="19" font-weight="800" letter-spacing="0.5" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">CORE TECH STACK</text>
  <line x1="320" y1="45" x2="840" y2="45" stroke="url(#tsLine)" stroke-width="1.5"/>

  <g font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <!-- BAND 1: FRONTEND (y 80-164) -->
    <text x="52" y="138" fill="#171717" font-size="44" font-weight="800" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">01</text>
    <rect x="112" y="102" width="3" height="44" fill="#dc2626"/>
    <text x="126" y="120" fill="#ffffff" font-size="17" font-weight="700">FRONTEND</text>
    <text x="126" y="144" font-size="13.5" fill="#b8b8b8">TypeScript<tspan fill="#dc2626"> · </tspan>React<tspan fill="#dc2626"> · </tspan>Next.js<tspan fill="#dc2626"> · </tspan>HTML5<tspan fill="#dc2626"> · </tspan>CSS3</text>
    <line x1="40" y1="164" x2="840" y2="164" stroke="#141414" stroke-width="1"/>

    <!-- BAND 2: BACKEND & IA (y 164-248) -->
    <text x="52" y="222" fill="#171717" font-size="44" font-weight="800" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">02</text>
    <rect x="112" y="186" width="3" height="44" fill="#dc2626"/>
    <text x="126" y="204" fill="#ffffff" font-size="17" font-weight="700">BACKEND &amp; IA</text>
    <text x="126" y="228" font-size="13.5" fill="#b8b8b8">Node.js<tspan fill="#dc2626"> · </tspan>Python<tspan fill="#dc2626"> · </tspan>n8n<tspan fill="#dc2626"> · </tspan>OpenAI<tspan fill="#dc2626"> · </tspan>LangChain</text>
    <line x1="40" y1="248" x2="840" y2="248" stroke="#141414" stroke-width="1"/>

    <!-- BAND 3: CLOUD & DEVOPS (y 248-332) -->
    <text x="52" y="306" fill="#171717" font-size="44" font-weight="800" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">03</text>
    <rect x="112" y="270" width="3" height="44" fill="#dc2626"/>
    <text x="126" y="288" fill="#ffffff" font-size="17" font-weight="700">CLOUD &amp; DEVOPS</text>
    <text x="126" y="312" font-size="13.5" fill="#b8b8b8">Docker<tspan fill="#dc2626"> · </tspan>Kubernetes<tspan fill="#dc2626"> · </tspan>AWS<tspan fill="#dc2626"> · </tspan>GitHub Actions<tspan fill="#dc2626"> · </tspan>Linux<tspan fill="#dc2626"> · </tspan>Terraform</text>
    <line x1="40" y1="332" x2="840" y2="332" stroke="#141414" stroke-width="1"/>

    <!-- BAND 4: DATABASES & APIs (y 332-416) -->
    <text x="52" y="390" fill="#171717" font-size="44" font-weight="800" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">04</text>
    <rect x="112" y="354" width="3" height="44" fill="#dc2626"/>
    <text x="126" y="372" fill="#ffffff" font-size="17" font-weight="700">DATABASES &amp; APIs</text>
    <text x="126" y="396" font-size="13.5" fill="#b8b8b8">PostgreSQL<tspan fill="#dc2626"> · </tspan>Redis<tspan fill="#dc2626"> · </tspan>REST API<tspan fill="#dc2626"> · </tspan>Webhooks<tspan fill="#dc2626"> · </tspan>OAuth2<tspan fill="#dc2626"> · </tspan>Apify</text>
    <line x1="40" y1="416" x2="840" y2="416" stroke="#141414" stroke-width="1"/>

    <!-- BAND 5: CIBERSEGURIDAD (accent band, y 416-500) -->
    <rect x="40" y="416" width="800" height="84" rx="8" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-opacity="0.25" stroke-width="1"/>
    <text x="68" y="474" fill="#3f0a0a" font-size="44" font-weight="800" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">05</text>
    <rect x="128" y="438" width="3" height="44" fill="#dc2626"/>
    <text x="142" y="456" fill="#ef4444" font-size="17" font-weight="700">CIBERSEGURIDAD OFENSIVA</text>
    <text x="142" y="480" font-size="13.5" fill="#d4d4d4">Burp Suite<tspan fill="#dc2626"> · </tspan>Metasploit<tspan fill="#dc2626"> · </tspan>Nmap<tspan fill="#dc2626"> · </tspan>Wireshark<tspan fill="#dc2626"> · </tspan>Splunk</text>
  </g>
</svg>
