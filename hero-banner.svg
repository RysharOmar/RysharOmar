<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="Ryshar Perez Nuñez - Ingeniero en Ciberseguridad">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#7f1d1d" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="titleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feFlood flood-color="#dc2626" flood-opacity="0.55"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ctaGlow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feFlood flood-color="#dc2626" flood-opacity="0.6"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="ctaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- background layers -->
  <rect width="880" height="360" fill="#0a0a0a"/>
  <rect width="880" height="360" fill="url(#redGlow)"/>
  <rect width="880" height="360" fill="url(#grid)"/>
  <rect width="880" height="360" fill="url(#vignette)"/>

  <!-- HUD corner brackets -->
  <g stroke="#3f3f46" stroke-width="1.5" fill="none" stroke-linecap="square">
    <path d="M14 30 L14 14 L30 14"/>
    <path d="M850 14 L866 14 L866 30"/>
    <path d="M14 330 L14 346 L30 346"/>
    <path d="M850 346 L866 346 L866 330"/>
  </g>

  <!-- top pill -->
  <g>
    <rect x="310" y="26" width="260" height="28" rx="14" fill="#dc2626" fill-opacity="0.08" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="332" cy="40" r="3" fill="#ef4444"/>
    <circle cx="332" cy="40" r="6" fill="#ef4444" fill-opacity="0.25"/>
    <text x="448" y="44" fill="#fca5a5" font-size="10.5" font-weight="600" letter-spacing="1.6"
          text-anchor="middle" font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      PERFIL EJECUTIVO · LISTO PARA PRODUCCIÓN
    </text>
  </g>

  <!-- title -->
  <text x="440" y="128" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1.5"
        text-anchor="middle" filter="url(#titleGlow)"
        font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    RYSHAR PÉREZ NUÑEZ
  </text>

  <!-- subtitle -->
  <text x="440" y="158" fill="#a3a3a3" font-size="14.5" letter-spacing="0.4"
        text-anchor="middle"
        font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    Ingeniero en Ciberseguridad · Arquitecto de Sistemas Resilientes
  </text>

  <!-- divider -->
  <line x1="380" y1="176" x2="500" y2="176" stroke="#262626" stroke-width="1"/>

  <!-- value proposition -->
  <text x="440" y="206" fill="#d4d4d4" font-size="17" text-anchor="middle"
        font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    Construyo sistemas que tu negocio
  </text>
  <text x="440" y="230" fill="#d4d4d4" font-size="17" text-anchor="middle"
        font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <tspan>no puede permitirse que </tspan><tspan fill="#ffffff" font-weight="700">fallen.</tspan>
  </text>

  <!-- status chips -->
  <g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10.5" letter-spacing="0.8">
    <!-- chip 1 -->
    <g transform="translate(126,257)">
      <rect width="200" height="26" rx="6" fill="#0d0d0d" stroke="#262626" stroke-width="1"/>
      <circle cx="14" cy="13" r="2.5" fill="#dc2626"/>
      <text x="24" y="17" fill="#ef4444">THREAT MODEL · OFFENSIVE</text>
    </g>
    <!-- chip 2 -->
    <g transform="translate(340,257)">
      <rect width="200" height="26" rx="6" fill="#0d0d0d" stroke="#262626" stroke-width="1"/>
      <circle cx="14" cy="13" r="2.5" fill="#dc2626"/>
      <text x="24" y="17" fill="#ef4444">AVAILABILITY · LIMITED</text>
    </g>
    <!-- chip 3 -->
    <g transform="translate(554,257)">
      <rect width="200" height="26" rx="6" fill="#0d0d0d" stroke="#262626" stroke-width="1"/>
      <circle cx="14" cy="13" r="2.5" fill="#525252"/>
      <text x="24" y="17" fill="#a3a3a3">ZERO TOLERANCE TO FAILURE</text>
    </g>
  </g>

  <!-- CTA pill -->
  <g filter="url(#ctaGlow)">
    <rect x="370" y="306" width="140" height="34" rx="8" fill="url(#ctaFill)"/>
    <text x="440" y="327" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle"
          font-family="'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif">
      Hablemos →
    </text>
  </g>
</svg>
