<svg xmlns="http://www.w3.org/2000/svg" width="720" height="110" viewBox="0 0 720 110">
  <!-- Fondo principal -->
  <rect x="0" y="0" width="720" height="110" fill="#171717"/>
  <!-- Barra roja lateral -->
  <rect x="0" y="0" width="4" height="110" fill="#dc2626"/>

  <!-- Texto principal -->
  <foreignObject x="4" y="0" width="716" height="110">
    <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:24px 24px 24px 24px;font-family:sans-serif;font-size:13.5px;line-height:1.6;">
      <p style="margin:0 0 8px 0;">
        <span style="color:#ffffff;">Si tu operación depende de procesos que </span>
        <strong style="color:#dc2626;">no pueden parar</strong>
        <span style="color:#ffffff;"> — no busques otro desarrollador.</span>
      </p>
      <p style="color:#525252;margin:0;">
        Buscas a alguien que elimine el riesgo desde el diseño.
      </p>
    </div>
  </foreignObject>
</svg>
