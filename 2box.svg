<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170">
  <!-- Fondo principal -->
  <rect x="0" y="0" width="560" height="138" fill="#171717"/>
  <!-- Barra roja lateral -->
  <rect x="0" y="0" width="4" height="138" fill="#dc2626"/>

  <!-- Texto principal -->
  <foreignObject x="4" y="0" width="556" height="138">
    <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:20px 24px;font-family:sans-serif;">
      <p style="margin:0 0 8px 0;font-size:15px;line-height:1.5;">
        <span style="color:#ffffff;">Si tu operación depende de procesos que </span>
        <strong style="color:#dc2626;">no pueden parar</strong>
        <span style="color:#ffffff;"> — no busques otro desarrollador.</span>
      </p>
      <p style="color:#525252;margin:0 0 16px 0;font-size:13px;line-height:1.5;">
