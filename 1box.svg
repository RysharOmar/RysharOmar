<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <rect x="0" y="0" width="720" height="200" fill="#171717" rx="0" ry="0"/>
  <rect x="0" y="0" width="4" height="200" fill="#dc2626"/>
  <foreignObject x="4" y="0" width="716" height="200">
    <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0;padding:14px 16px 14px 16px;font-family:sans-serif;font-size:13.5px;line-height:1.6;">
      <div style="margin-bottom:12px;">
        <span style="color:#ffffff;">No ensamblo componentes. Diseño </span>
        <span style="color:#dc2626;font-weight:bold;">operaciones resilientes</span>
        <span style="color:#ffffff;"> pensadas para escalar.</span>
      </div>
      <div style="margin-bottom:12px;">
        <span style="color:#a3a3a3;">Combino ciberseguridad ofensiva y desarrollo full-stack para construir infraestructuras que no solo funcionan: </span>
        <span style="color:#ffffff;font-weight:bold;">resisten</span>
        <span style="color:#a3a3a3;">. Integro IA, CRMs y bases de datos legacy sin abrir brechas.</span>
      </div>
      <div style="margin-bottom:12px;">
        <span style="color:#a3a3a3;">Trabajo donde un minuto caído cuesta miles de euros. </span>
        <span style="color:#ffffff;font-weight:bold;">Seguridad desde la primera línea</span>
        <span style="color:#a3a3a3;">, sin atajos.</span>
      </div>
      <div>
        <em style="color:#525252;">Pocos proyectos a la vez. Solo los que exigen alto impacto y tolerancia cero al fallo.</em>
      </div>
    </div>
  </foreignObject>
</svg>
