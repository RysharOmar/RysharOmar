<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="Sitio Web">
  <defs>
    <linearGradient id="bgWeb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E11D2A"/>
      <stop offset="100%" stop-color="#9F0B1B"/>
    </linearGradient>
    <filter id="shadowWeb" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="320" height="80" rx="16" fill="url(#bgWeb)" filter="url(#shadowWeb)"/>
  <!-- Inner subtle border -->
  <rect x="1.5" y="1.5" width="317" height="77" rx="14.5" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  <!-- Globe icon -->
  <g transform="translate(24, 16)" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="20"/>
    <path d="M4 24h40"/>
    <path d="M24 4c5.6 6 8.4 12 8.4 20s-2.8 14-8.4 20"/>
    <path d="M24 4c-5.6 6-8.4 12-8.4 20s2.8 14 8.4 20"/>
  </g>
  <!-- Text -->
  <text x="100" y="50" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff" text-rendering="geometricPrecision">Sitio Web</text>
</svg>
